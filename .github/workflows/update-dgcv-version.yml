name: Update dgcv Version Include

on:
  workflow_dispatch:
  release:
    types: [published]
    
permissions:
  contents: read

jobs:
  push-version-include:
    name: Push dgcv version include to realandimaginary.com
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build include files
        run: |
          set -euo pipefail
          mkdir -p includes/dgcv
          python3 - <<'PY'
          import configparser, pathlib
          cfg = configparser.ConfigParser()
          cfg.read("setup.cfg")
          version = cfg["metadata"]["version"].strip()
          if not version or version.startswith("attr:"):
              raise SystemExit(f"Could not read a literal version from setup.cfg: {version!r}")
          pathlib.Path("includes/dgcv/dgcv_version.txt").write_text(version)
          PY
          # Release date in UTC, e.g. "October 6, 2026"
          TZ=UTC date '+%B %-d, %Y' | tr -d '\n' > includes/dgcv/latest-rel-date.txt
          echo "Version: $(cat includes/dgcv/dgcv_version.txt)"
          echo "Date:    $(cat includes/dgcv/latest-rel-date.txt)"

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DGCV_TO_RAI_KEY }}
          KNOWN_HOSTS: ${{ secrets.RAI_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # Load the key into an agent so it never touches the disk
          eval "$(ssh-agent -s)"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' | ssh-add -
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Upload files
        env:
          RAI_USER: ${{ secrets.MEATRAI }}
          RAI_HOST: ${{ secrets.RAIHOME }}
          RAI_PORT: ${{ secrets.RAISSH }}
        run: |
          set -euo pipefail
          DEST="realandimaginary.com/includes/dgcv"
          SSH_OPTS=(-o StrictHostKeyChecking=yes -o BatchMode=yes)
          ssh -p "$RAI_PORT" "${SSH_OPTS[@]}" "$RAI_USER@$RAI_HOST" "mkdir -p ~/$DEST"
          scp -P "$RAI_PORT" "${SSH_OPTS[@]}" \
            setup.cfg README.md \
            includes/dgcv/dgcv_version.txt includes/dgcv/latest-rel-date.txt \
            "$RAI_USER@$RAI_HOST:$DEST/"

      - name: Stop SSH agent
        if: always()
        run: ssh-agent -k || true
